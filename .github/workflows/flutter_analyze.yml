name: Flutter Analyze
# Includes the stacked phase-3 discounts PR base branch.
# Validates the current PR head after each catalog integration update.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/products-supabase-sync]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos .
      - name: Tests
        run: flutter test --reporter expanded
