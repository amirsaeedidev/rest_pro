name: Flutter CI and Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Analyze, test, and build Android
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Supabase configuration
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_URL."
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ANON_KEY."
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::SUPABASE_URL must be a valid https://<project-ref>.supabase.co URL."; exit 1 ;;
          esac

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Tests
        run: flutter test --no-pub

      - name: Build release APK
        run: |
          flutter build apk --release --no-pub \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Build release App Bundle
        run: |
          flutter build appbundle --release --no-pub \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v5
        with:
          name: restaurant-android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
